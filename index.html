<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RetroVision</title>
    <link rel="canonical" href="https://go-retrovision.github.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://go-retrovision.github.io/" />
    <meta property="og:title" content="RetroVision" />
    <meta
      property="og:image"
      content="https://go-retrovision.github.io/retrovision-splash.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="./retrovision-favicon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="stage" role="img" aria-label="RetroVision">
      <img
        class="stage-bg"
        src="./retrovision-splash.png"
        alt=""
        width="1920"
        height="1080"
        decoding="async"
        fetchpriority="high"
      />
      <div class="companions">
        <div class="mark-plate mark-plate-vault">
          <img
            class="mark mark-vault"
            src="./retro-vault-mark.png"
            alt=""
            width="512"
            height="512"
            decoding="async"
          />
        </div>
        <div class="mark-plate mark-plate-panda">
          <img
            class="mark mark-panda"
            src="./panda-mark.png"
            alt=""
            width="512"
            height="512"
            decoding="async"
          />
        </div>
      </div>
    </div>
  </body>
</html>
